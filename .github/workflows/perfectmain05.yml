name: checktest
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ctest
  cancel-in-progress: false

jobs:
  poll-bms:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check expiry date
        id: expiry
        shell: bash
        run: |
          EXPIRY_DATE="2026-08-01"
          TODAY=$(TZ=Asia/Kolkata date +%F)

          echo "Today in IST: $TODAY"
          echo "Expiry date in IST: $EXPIRY_DATE"

          if [[ "$TODAY" > "$EXPIRY_DATE" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Expiry day is over. Workflow will stop."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Workflow is allowed to run."
          fi

      - name: Record workflow start time
        if: steps.expiry.outputs.allowed == 'true'
        id: timing
        shell: bash
        run: |
          START_TIME=$(date +%s)
          NEXT_TIME=$((START_TIME + 19800))

          echo "start_time=$START_TIME" >> "$GITHUB_OUTPUT"
          echo "next_time=$NEXT_TIME" >> "$GITHUB_OUTPUT"

          echo "Next workflow trigger planned in 5 hours 30 minutes."

      - name: Checkout Repository
        if: steps.expiry.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.expiry.outputs.allowed == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        if: steps.expiry.outputs.allowed == 'true'
        run: |
          pip install requests curl-cffi

      - name: Configure Git User
        if: steps.expiry.outputs.allowed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true

      - name: Install and Setup Cloudflare WARP
        if: steps.expiry.outputs.allowed == 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
            --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect

          sleep 5
          warp-cli --accept-tos status

          curl -x socks5://127.0.0.1:40000 \
            https://1.1.1.1/cdn-cgi/trace \
            | grep warp || echo "WARP test failed, but continuing."

      - name: Run Polling Script
        if: steps.expiry.outputs.allowed == 'true'
        run: |
          python -u smbed_acdc_3107.py

      - name: Wait until 5 hours 30 minutes from workflow start
        if: steps.expiry.outputs.allowed == 'true'
        shell: bash
        run: |
          NEXT_TIME="${{ steps.timing.outputs.next_time }}"
          NOW=$(date +%s)
          WAIT_SECONDS=$((NEXT_TIME - NOW))

          if (( WAIT_SECONDS > 0 )); then
            echo "Waiting $WAIT_SECONDS seconds before starting next workflow."
            sleep "$WAIT_SECONDS"
          else
            echo "The 5 hour 30 minute point has already passed."
            echo "Starting the next workflow immediately."
          fi

      - name: Check whether next workflow is allowed
        if: steps.expiry.outputs.allowed == 'true'
        id: next_check
        shell: bash
        run: |
          EXPIRY_DATE="2026-07-26"
          TODAY=$(TZ=Asia/Kolkata date +%F)

          if [[ "$TODAY" > "$EXPIRY_DATE" ]]; then
            echo "start_next=false" >> "$GITHUB_OUTPUT"
            echo "Expiry day is over. No new workflow will be started."
          else
            echo "start_next=true" >> "$GITHUB_OUTPUT"
            echo "Next workflow is allowed."
          fi

      - name: Start next workflow
        if: |
          steps.expiry.outputs.allowed == 'true' &&
          steps.next_check.outputs.start_next == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

          echo "Next workflow requested."
